# Forked from OpenSpec's spec-driven schema at 79b6aa9.
# Kept from upstream on purpose: artifact IDs, generated paths, the requires
# graph, apply tracking, the proposal artifact, delta-spec syntax, and the
# checkbox format. Everything else is rewritten for Lean TDD: specs hold only
# acceptance criteria, design reviews the module boundaries starting with the
# API their tests call, tasks follow the spec order, and apply holds the only
# copy of the test-first loop.
name: lean-tdd
version: 1
description: OpenSpec artifacts for a Lean TDD cycle driven by acceptance criteria
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: |
      Create the proposal document that establishes WHY this change is needed.

      Sections:
      - **Why**: 1-2 sentences on the problem or opportunity. What problem does this solve? Why now?
      - **What Changes**: Bullet list of changes. Be specific about new capabilities, modifications, or removals. Mark breaking changes with **BREAKING**.
      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<capability-path>/spec.md`. Use kebab-case for path segments you introduce (e.g., `user-auth` or `identity/user-auth`) and follow the project's existing spec organization.
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes (not just implementation details). Each needs a delta spec file. Use the exact existing path under `openspec/specs/`. Leave empty if no requirement changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.

      IMPORTANT: The Capabilities section is critical. It creates the contract between
      proposal and specs phases. Research existing specs before filling this in:
      run `openspec list --specs` for the project's capability inventory, then
      `openspec show "<spec-id>" --type spec --json --no-scenarios` for any that
      look related - that returns a capability's purpose and requirement texts
      without pulling whole spec files into context. Append `--store "<id>"` to
      both commands only for a registered standalone store, and keep `--type
      spec`: a change and a spec sharing a name is otherwise an ambiguous-item
      error. `openspec list` without `--specs` lists in-flight changes, not
      specs - it never shows what the project already covers. Reuse an existing
      capability's exact path instead of introducing a near-duplicate name.
      The filtered read is only an overview. Before deciding what is already
      covered or what should change, read each relevant spec in full, including
      scenarios, with `openspec show "<spec-id>" --type spec` (same `--store` rule).
      Each capability listed here will need a corresponding spec file.

      Every change must either declare at least one capability (new or
      modified) or explicitly opt out of specs: `openspec validate` rejects a
      change with zero deltas unless the change's `.openspec.yaml` sets
      `skip_specs: true`. Use `skip_specs: true` only when no spec-level
      behavior changes (pure refactor, tooling, docs) - specs describe
      behavior, so if behavior does not change, no spec should change either.
      Do not invent a requirement just to satisfy validation.

      Keep it concise (1-2 pages). Focus on the "why" not the "how" -
      implementation details belong in design.md.

      This is the foundation - specs, design, and tasks all build on this.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Acceptance criteria and their acceptance-test scenarios
    template: spec.md
    instruction: |
      Write one delta spec per capability in the proposal. In this schema a
      spec is the change's ordered list of acceptance criteria and nothing else.

      Acceptance criteria:
      - Each `### Requirement: <outcome name>` is one user-facing acceptance
        criterion. Name the outcome in plain words, with no AC number, and
        state its observable rule in one SHALL/MUST sentence.
      - Each `#### Scenario: <short name>` under it is exactly one automated
        acceptance test at the highest useful public boundary. Put the simple
        happy path first, then distinct boundary or error cases. Use
        GIVEN/WHEN/THEN; omit GIVEN when setup adds nothing.
      - APIs a test only needs for setup or observation (for example `count()`
        to observe `add_item()`) are not requirements and get no scenarios of
        their own. Name them inside the scenario steps; design.md reviews them.
        Make one its own requirement only when it delivers a separate outcome
        this change is meant to provide.
      - Choose scenarios so that every API a test calls is seen changing
        state. A hardcoded stub must not be able to pass them.
      - Order requirements in the order they will be built, prerequisite
        outcomes first. That order is the change's AC-1..AC-N numbering, and
        tasks follow it exactly. With several delta files, numbering runs
        across them in the proposal's capability order.
      - Leave out implementation steps, internal names, library choices, and
        test helpers.

      OpenSpec delta format (validation and archive depend on it):
      - Path: `specs/<capability-path>/spec.md`, using the exact path from the
        proposal. For a modified capability, confirm the existing path with
        `openspec list --specs` (append `--store "<id>"` only for a registered
        standalone store); do not move or rename it.
      - Sections: `## ADDED Requirements`, `## MODIFIED Requirements`,
        `## REMOVED Requirements` (each with **Reason** and **Migration**), and
        `## RENAMED Requirements` (FROM:/TO: format).
      - MODIFIED: copy the entire existing block, from `### Requirement:`
        through all scenarios, from
        `<planningHome.root>/openspec/specs/<capability-path>/spec.md`, keep
        its heading exactly, then edit. Partial blocks lose detail at archive.
        Use ADDED for new behavior that leaves existing rules intact.
      - Scenarios MUST use exactly four hashes (`#### Scenario:`); other forms
        fail silently. Every requirement needs at least one scenario.
      - New capability only: the first section is `## Purpose`, one or two
        sentences of 50+ characters. Never add Purpose to a delta for an
        existing capability; edit that main spec directly to change it.
        `planningHome.root` comes from `openspec instructions ... --json`.
      - At least one spec file is required unless `.openspec.yaml` sets
        `skip_specs: true`. If the proposal lists no capabilities and that
        marker is not set, revisit the proposal first.

      Example (a new capability):
      ```
      # Spec Delta

      ## Purpose

      Lets callers add to-do items and observe how many the list contains.

      ## ADDED Requirements

      ### Requirement: Adding an item increases the count
      The list SHALL increase its item count by one for each successful `add_item()` call.

      #### Scenario: First item
      - **GIVEN** a new list whose `count()` is zero and `empty()` is true
      - **WHEN** the caller invokes `add_item("buy milk")`
      - **THEN** `count()` is one and `empty()` is false

      #### Scenario: Another item
      - **GIVEN** a list whose `count()` is one
      - **WHEN** the caller invokes `add_item("write tests")`
      - **THEN** `count()` is two
      ```
    requires:
      - proposal

  - id: design
    generates: design.md
    description: The module boundaries a change touches, starting with the API the acceptance tests call, and test boundaries
    template: design.md
    instruction: |
      Write design.md after the delta specs, in bullets and code blocks. It
      reviews the module boundaries the change touches, starting with the API
      the acceptance tests call.

      Sections:
      - **Module boundaries**: open with a **Net complexity** line: the modules,
        dependencies, and concepts this change adds, and what it removes. Then
        one subsection per boundary, headed by its code name and marked public
        or internal, new or existing. A boundary is any function, class,
        module, package, client, or service. Start with the public API the
        acceptance tests call, then add only the internal boundaries whose
        design decisions matter to this change. Give each boundary four
        bullets:
        - **Usage:** representative caller-side code, with results, errors,
          and any order or coordination the caller must handle. For the
          public API, show the setup, focal, and observation calls the
          scenarios make, and name the criterion each focal call serves.
          Review it as a caller would; if it shows a missing or awkward
          rule, revise the specs and design together.
        - **Hides:** the knowledge or decisions callers no longer need.
        - **Abstraction:** the one concept the interface presents, general
          enough to serve more than this feature.
        - **Specifics:** the feature- or implementation-specific details kept
          out of this interface, and the layer that owns them.
        Prefer extending an existing module to adding one. A new boundary must
        hide more than its interface exposes; otherwise fold it into its
        caller. Before writing tasks, fix these: the same knowledge in two
        modules, callers that must call things in a set order, pass-through
        methods or wrappers, and special cases or flags in a general-purpose
        module. The acceptance tests cover every boundary listed here.
      - **Test boundaries**: the test level for each criterion (public
        function, CLI, HTTP, UI) and why. Use the testing trophy
        (https://kentcdodds.com/blog/the-testing-trophy-and-testing-classifications)
        as a guide: public API or integration tests carry most criteria;
        UI or end-to-end tests are for UI behavior; static checks run
        throughout. No fixed ratio.
      - **Decisions**: only non-obvious choices, each with the alternatives
        considered. Include migration or rollback here when relevant. Omit if
        none.
      - **Risks / Trade-offs**: `[Risk] → Mitigation`, including what the
        acceptance tests cannot catch.

      Point to the proposal for motivation and to the specs for rules instead
      of restating them. If a question would change the specs, the API, or
      the tasks, ask the user now instead of guessing.
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Checklist that follows the acceptance criteria in spec order
    template: tasks.md
    instruction: |
      Turn the delta specs into a checklist. tasks.md mirrors the spec order;
      it does not re-plan the work.

      Layout:
      - `## 1. Baseline` with one task: discover the project's language, test
        framework, and commands from its files, CI, and nearby tests; run the
        suites related to the criteria; record commands, results, and
        preexisting failures. These suites stay in the regression set.
      - Then one group per requirement, in spec order:
        `## <n>. AC-<k> <requirement name>`, where AC-k is the requirement's
        position in this change. Append "(modified)" for a MODIFIED one.
      - Inside each group, one task per scenario, in spec order:
        `- [ ] <n>.<m> <scenario name>: <what to verify>`. Building every API
        the scenario calls is part of that task.
      - REMOVED or RENAMED requirements: a group after the criteria whose
        tasks delete or rewrite the affected tests and test comments.
      - Last: `## <n>. Final regression` with one task to run the full
        relevant suite and report commands and results.

      Do not reorder groups by dependency; the spec order already puts
      prerequisites first. Do not add tasks that test the setup or observation
      APIs on their own, and do not add separate testing or documentation
      groups. Work a criterion needs, docs included, goes in its own group.
      Build each module boundary from design.md inside the first scenario
      task that needs it.

      Checkbox tracking: follow the template exactly. Apply parses
      `- [ ] X.Y description`; a box holding only `x` (either case, any
      spacing) is done, and any other marker or a line without a checkbox is
      not tracked as done.
    requires:
      - specs
      - design

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Work through tasks.md in order. Check off a task only after its checks
    pass and you have reported their commands and results. Pause on blockers
    or unclear requirements.

    1. Complete the baseline task before writing new tests or code.
    2. For each scenario task:
       a. Write the acceptance test from the scenario steps. Comment it with
          the requirement and scenario names, for example
          `# Adding an item increases the count / First item`. AC numbers are
          local to the change, so do not use them in code.
       b. Stub every API the test calls so it imports and passes the
          available lint and type checks.
       c. Run it red. Any assertion failure in the scenario counts, even on
          an observation call before the focal call. Import, syntax, and type
          errors do not. Report the command and a short failure summary in chat.
       d. Implement the simplest sound behavior for everything the scenario
          calls, behind the module boundaries in design.md. Rerun the focused
          test and the baseline suites.
       e. Refactor after green only when it removes duplication, clarifies
          structure, keeps knowledge behind the boundary that owns it, or
          moves a specific detail to its layer, then rerun.
    3. Add a lower-level test only when the acceptance test cannot isolate
       complex logic or gives feedback too slowly, and say why in chat. An API
       existing is not a reason to test it on its own.
    4. If a failure reveals a new user-observable outcome, add or revise the
       requirement and its scenarios first, then design and tasks, then
       continue. If the implementation needs a boundary design.md does not
       list, or must break one, update its Module boundaries first and say
       why in chat.
    5. If an automated red run is impractical, explain why and give
       alternative evidence.
    6. In the final regression task, separate preexisting failures from new
       regressions.
